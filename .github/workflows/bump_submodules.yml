# FORK NOTE (this repository is a fork of ROCm/TheRock):
# The `schedule` and `push` triggers of this workflow were removed here. The
# automation bumps submodules and opens PRs against ROCm/TheRock using
# AMD-internal GitHub App credentials (ROCM_SYSTEMS_APP_ID,
# ROCM_SYSTEMS_APP_PRIVATE_KEY, ROCM_LIBRARIES_APP_ID,
# ROCM_LIBRARIES_APP_PRIVATE_KEY) that are configured as repository secrets
# only in the upstream repository - forks do not inherit secrets. Every
# automatic run in this fork therefore failed within about a minute at the
# "Generate GitHub App token" step (12 of 12 scheduled runs failed), while
# accomplishing nothing: the tokens are scoped to ROCm/TheRock and the
# ROCm/* repositories, which this fork cannot write to anyway.
# The steps belonging to the removed triggers are kept but inert, to keep this
# file close to upstream. Run the real automation on ROCm/TheRock, or configure
# equivalent GitHub App credentials in this fork's secrets and trigger it
# manually (the first step then verifies the credentials before anything else).

name: Bump Submodule automation

on:
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Submodule to bump (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - rocm-systems
          - rocm-libraries
          - rocgdb
          - mesa-fork
      pin_before:
        description: 'Pin-only replay: TheRock SHA before the submodule bump (leave empty for a normal bump)'
        required: false
        default: ''
      pin_after:
        description: 'Pin-only replay: TheRock SHA to pin the submodule CI to'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  bump-submodules:
    runs-on: ubuntu-24.04
    # App tokens create and close PRs. GITHUB_TOKEN cancels runs on those PRs.

    env:
      INPUT_SUBMODULE: ${{ github.event.inputs.submodule || 'all' }}

    steps:
      # Fail fast, before the checkout, when the automation credentials are not
      # configured. In this fork they never are, and without this check the
      # failure would only surface at the "Generate GitHub App token" steps
      # below with a cryptic action error. See the FORK NOTE at the top.
      - name: Check automation credentials
        env:
          SYSTEMS_APP_ID: ${{ secrets.ROCM_SYSTEMS_APP_ID }}
          SYSTEMS_APP_KEY: ${{ secrets.ROCM_SYSTEMS_APP_PRIVATE_KEY }}
          LIBRARIES_APP_ID: ${{ secrets.ROCM_LIBRARIES_APP_ID }}
          LIBRARIES_APP_KEY: ${{ secrets.ROCM_LIBRARIES_APP_PRIVATE_KEY }}
        run: |
          missing=()
          if [[ -z "${SYSTEMS_APP_ID}" || -z "${SYSTEMS_APP_KEY}" ]]; then
            missing+=("ROCM_SYSTEMS_APP_ID + ROCM_SYSTEMS_APP_PRIVATE_KEY")
          fi
          if [[ -z "${LIBRARIES_APP_ID}" || -z "${LIBRARIES_APP_KEY}" ]]; then
            missing+=("ROCM_LIBRARIES_APP_ID + ROCM_LIBRARIES_APP_PRIVATE_KEY")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing GitHub App credentials: ${missing[*]}."
            echo "::error::This is AMD's submodule bump automation for ROCm/TheRock. It needs"
            echo "::error::GitHub App credentials that exist only in the upstream repository"
            echo "::error::(forks do not inherit repository secrets), so it cannot run here."
            echo "::error::Trigger it on ROCm/TheRock, or configure equivalent GitHub App"
            echo "::error::credentials in this fork's secrets (Settings > Secrets and variables"
            echo "::error::> Actions) and re-run."
            exit 1
          fi
          echo "All required automation credentials are present."

      - name: Checkout ROCm/TheRock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bump automation pushes from temporary clones authenticated with GitHub App tokens.
          persist-credentials: false
          fetch-depth: 0

      - name: Select scheduled submodule
        id: schedule
        if: github.event_name == 'schedule'
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          submodules=()
          case "${EVENT_SCHEDULE}" in
            "0 */12 * * *") submodules+=("rocgdb" "mesa-fork") ;;
            "0 7 * * *") submodules+=("rocm-systems" "rocm-libraries") ;;
            "0 16 * * *") submodules+=("rocm-systems") ;;
            "0 19 * * *") submodules+=("rocm-libraries") ;;
          esac
          echo "submodules=${submodules[*]}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Generate GitHub App token rocm-systems
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: systems-token
        with:
          app-id: ${{ secrets.ROCM_SYSTEMS_APP_ID }}
          private-key: ${{ secrets.ROCM_SYSTEMS_APP_PRIVATE_KEY }}
          owner: "ROCm"
          # We will reuse the rocm-systems token for rocgdb and mesa-fork for now.
          repositories: "rocm-systems,rocgdb,mesa-fork,TheRock"
          permission-contents: write      # Push bump branches and delete stale branches.
          permission-pull-requests: write # Manage PRs, labels, and breadcrumb comments.
          permission-workflows: write     # Update TheRock refs in upstream workflow files.

      - name: Generate GitHub App token rocm-libraries
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: librarian-token
        with:
          app-id: ${{ secrets.ROCM_LIBRARIES_APP_ID }}
          private-key: ${{ secrets.ROCM_LIBRARIES_APP_PRIVATE_KEY }}
          owner: "ROCm"
          repositories: "rocm-libraries,TheRock"
          permission-actions: read        # Find successful CI runs for stage reuse.
          permission-contents: write      # Push bump branches and delete stale branches.
          permission-pull-requests: write # Manage PRs, labels, and breadcrumb comments.
          permission-workflows: write     # Update TheRock refs in upstream workflow files.

      - name: Install prerequisites
        run: |
          pip install requests

      # The script authenticates temporary clones and pushes with SYSTEMS_TOKEN or LIBRARIES_TOKEN
      # from the GitHub App token steps above; it does not use checkout credentials.
      - name: Run scheduled bump automation
        if: github.event_name == 'schedule' && steps.schedule.outputs.submodules != ''
        env:
          SCHEDULE_SUBMODULES: ${{ steps.schedule.outputs.submodules }}
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
        run: |
          for submodule in ${SCHEDULE_SUBMODULES}; do
            python3 build_tools/github_actions/bump_automation.py \
              --event_type "schedule" \
              --submodule "${submodule}" \
              --systems_token "${SYSTEMS_TOKEN}" \
              --libraries_token "${LIBRARIES_TOKEN}" \
              --rocgdb_token "${SYSTEMS_TOKEN}" \
              --mesa_token "${SYSTEMS_TOKEN}"
          done

      # With pin_before/pin_after set, replays the push-event ref/pin update
      # for one submodule without opening a new "Bump <submodule>" PR in
      # TheRock (e.g. to apply a bump_automation.py fix to an already-landed
      # bump). Otherwise runs a normal bump like the scheduled step.
      # Temporary clones and pushes use SYSTEMS_TOKEN or LIBRARIES_TOKEN from the App token steps.
      - name: Run manually dispatched bump automation
        if: github.event_name == 'workflow_dispatch'
        env:
          PIN_BEFORE: ${{ github.event.inputs.pin_before }}
          PIN_AFTER: ${{ github.event.inputs.pin_after }}
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          token_args=(
            --systems_token "${SYSTEMS_TOKEN}"
            --libraries_token "${LIBRARIES_TOKEN}"
            --rocgdb_token "${SYSTEMS_TOKEN}"
            --mesa_token "${SYSTEMS_TOKEN}"
          )

          if [[ -z "${PIN_BEFORE}" && -z "${PIN_AFTER}" ]]; then
            python3 build_tools/github_actions/bump_automation.py \
              --event_type "schedule" \
              --submodule "${INPUT_SUBMODULE}" \
              "${token_args[@]}"
            exit 0
          fi

          # Lowercase only: bump_automation.py matches existing pins with a
          # lowercase SHA regex, so an uppercase pin would never be updated.
          sha_re='^[0-9a-f]{40}$'
          if [[ ! "${PIN_BEFORE}" =~ ${sha_re} || ! "${PIN_AFTER}" =~ ${sha_re} ]]; then
            echo "::error::pin_before and pin_after must both be full 40-character lowercase commit SHAs (got pin_before='${PIN_BEFORE}' pin_after='${PIN_AFTER}')."
            exit 1
          fi
          if [[ "${INPUT_SUBMODULE}" == "all" ]]; then
            echo "::error::submodule must name one specific submodule (not 'all') when pin_before/pin_after are set."
            exit 1
          fi

          python3 build_tools/github_actions/bump_automation.py \
            --event_type "push" \
            --before "${PIN_BEFORE}" \
            --after "${PIN_AFTER}" \
            --only-submodule "${INPUT_SUBMODULE}" \
            --skip-next-bump \
            --actions_token "${ACTIONS_TOKEN}" \
            "${token_args[@]}"

      # Temporary clones and pushes use SYSTEMS_TOKEN or LIBRARIES_TOKEN from the App token steps.
      # ACTIONS_TOKEN is the workflow GITHUB_TOKEN (actions: write) and only cancels runs.
      - name: Run push automation
        if: github.event_name == 'push'
        env:
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python3 build_tools/github_actions/bump_automation.py \
            --event_type "push" \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --systems_token "${SYSTEMS_TOKEN}" \
            --libraries_token "${LIBRARIES_TOKEN}" \
            --rocgdb_token "${SYSTEMS_TOKEN}" \
            --mesa_token "${SYSTEMS_TOKEN}" \
            --actions_token "${ACTIONS_TOKEN}"

      - name: Post bump breadcrumbs to upstream PRs
        # A failed cancel fails the push step; still post breadcrumbs unless the job was cancelled.
        if: github.event_name == 'push' && !cancelled()
        continue-on-error: true
        env:
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
        run: |
          python3 build_tools/github_actions/post_bump_breadcrumbs.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --systems_token "${SYSTEMS_TOKEN}" \
            --libraries_token "${LIBRARIES_TOKEN}" \
            --rocgdb_token "${SYSTEMS_TOKEN}"
